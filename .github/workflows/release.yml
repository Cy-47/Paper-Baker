name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build cross-platform binaries
        run: pnpm --filter @paper-baker/cli build:binary:all

      # The macOS binaries are cross-built on Linux, so they're unsigned — and
      # Apple Silicon kills unsigned arm64 code on launch. rcodesign ad-hoc signs
      # Mach-O binaries on Linux (codesign is macOS-only), making them launchable.
      - name: Ad-hoc sign macOS binaries
        run: |
          RC_VER=0.29.0
          curl -fsSL -o /tmp/rc.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/${RC_VER}/apple-codesign-${RC_VER}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/rc.tar.gz -C /tmp
          RC="$(find /tmp -name rcodesign -type f | head -1)"
          for b in apps/cli/binaries/pb-darwin-arm64 apps/cli/binaries/pb-darwin-x64; do
            echo "Signing $b"
            "$RC" sign "$b"
          done

      # Checksums MUST be generated after signing — signing rewrites the Mach-O,
      # so a pre-signing hash wouldn't match the uploaded artifact. install.sh
      # downloads <asset>.sha256 and verifies before installing.
      - name: Generate checksums
        run: |
          cd apps/cli/binaries
          for f in pb-*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/cli/binaries/pb-*
          fail_on_unmatched_files: true
